# Homo (192.168.10.60): Supabase em /opt/supabase. Modelo: copie para hosts.ini (fora do git) e preencha.
# O host TEM de ser 192.168.10.60: as URLs do Supabase (API_EXTERNAL_URL etc.) usam o nome do host.
# Os supabase_* existentes devem ser os MESMOS de /opt/supabase/.env no servidor; senha ou JWT novos
# quebram o banco e as chaves que os apps já usam. Só os supabase_s3_* são novos (openssl rand -hex 16 / 32).
[servers]
192.168.10.60 ansible_user=root \
  domain=grupoazuos.app \
  supabase_postgres_password=VALOR_DO_ENV \
  supabase_jwt_secret=VALOR_DO_ENV \
  supabase_anon_key=VALOR_DO_ENV \
  supabase_service_role_key=VALOR_DO_ENV \
  supabase_dashboard_password=VALOR_DO_ENV \
  supabase_secret_key_base=VALOR_DO_ENV \
  supabase_realtime_enc_key=VALOR_DO_ENV \
  supabase_s3_access_key_id=GERE_HEX_16 \
  supabase_s3_access_key_secret=GERE_HEX_32 \
  supabase_profiles=
