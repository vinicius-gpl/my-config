---
# =========================================================================
# === BASE: SISTEMA, FIREWALL E DOCKER (MULTI-DISTRO) ===
# =========================================================================

- name: "[base] Verificar se Docker está instalado"
  command: which docker
  register: docker_check
  failed_when: false
  changed_when: false
  tags: [always]

- name: "[base] Garantir 2GB de Swap ativo em servidores com pouca RAM (Rocky Linux / Oracle Micro)"
  shell: |
    if [ ! -f /swapfile ] || [ $(stat -c %s /swapfile 2>/dev/null || echo 0) -lt 1048576000 ]; then
      dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
      chmod 0600 /swapfile
      mkswap /swapfile
    fi
    swapon /swapfile 2>/dev/null || true
  when: (ansible_swaptotal_mb | default(0) < 512) and (ansible_memtotal_mb | default(2048) < 2048)
  tags: [base, always]

- name: "[base] Persistir swapfile no /etc/fstab"
  mount:
    name: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present
  when: (ansible_swaptotal_mb | default(0) < 512) and (ansible_memtotal_mb | default(2048) < 2048)
  tags: [base, always]

- name: "[base] Instalar dependências (Família RedHat: Fedora/Rocky/CentOS)"
  dnf:
    name:
      - dnf-plugins-core
      - firewalld
      - curl
    state: present
  when: ansible_os_family == 'RedHat' and (docker_check.rc != 0 or 'base' in ansible_run_tags or 'all' in ansible_run_tags)
  tags: [base, always]

- name: "[base] Adicionar repositório do Docker (RedHat)"
  command: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
  args:
    creates: /etc/yum.repos.d/docker-ce.repo
  when: ansible_os_family == 'RedHat' and (docker_check.rc != 0 or 'base' in ansible_run_tags or 'all' in ansible_run_tags)
  tags: [base, always]

- name: "[base] Instalar Docker (RedHat)"
  dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    allowerasing: yes
    state: present
  when: ansible_os_family == 'RedHat' and (docker_check.rc != 0 or 'base' in ansible_run_tags or 'all' in ansible_run_tags)
  tags: [base, always]

- name: "[base] Iniciar e habilitar Docker e Firewalld (RedHat)"
  systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - docker
    - firewalld
  when: ansible_os_family == 'RedHat'
  tags: [base, always]

- name: "[base] Instalar dependências e Docker (Família Debian: Ubuntu/Debian)"
  block:
    - name: "[base] Atualizar cache do apt"
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "[base] Instalar pacotes base Debian"
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: "[base] Criar diretório para keyrings do apt"
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: "[base] Baixar chave GPG oficial do Docker"
      get_url:
        url: "https://download.docker.com/linux/{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'debian' }}/gpg"
        dest: /etc/apt/keyrings/docker.gpg
        mode: '0644'

    - name: "[base] Adicionar repositório Docker no apt"
      apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'debian' }} {{ ansible_distribution_release }} stable"
        state: present

    - name: "[base] Instalar pacotes Docker"
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: "[base] Iniciar e habilitar Docker (Debian)"
      systemd:
        name: docker
        state: started
        enabled: yes
  when: ansible_os_family == 'Debian' and (docker_check.rc != 0 or 'base' in ansible_run_tags or 'all' in ansible_run_tags)
  tags: [base, always]

- name: "[base] Abrir portas padrão no Firewalld (se ativo)"
  firewalld:
    port: "{{ item }}"
    permanent: yes
    state: enabled
    immediate: yes
  loop:
    - 80/tcp
    - 443/tcp
    - 443/udp
    - 8000/tcp
    - 7824/udp
    - 45876/tcp
  failed_when: false
  tags: [base]

- name: "[base] Aguardar socket do Docker estar ativo"
  wait_for:
    path: /var/run/docker.sock
    state: present
    timeout: 20
  tags: [base, proxy, always]

- name: "[base] Criar rede Docker compartilhada (proxy)"
  command: docker network create proxy
  register: proxy_net
  failed_when:
    - proxy_net.rc != 0
    - '"already exists" not in proxy_net.stderr'
  changed_when: proxy_net.rc == 0
  tags: [base, proxy, always]
