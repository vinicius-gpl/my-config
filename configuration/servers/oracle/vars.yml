# Variáveis não-secretas do servidor Oracle (carregadas pelo workflow de deploy
# e, localmente, com `-e @configuration/servers/oracle/vars.yml`).

# Rede da VPN (NetBird) e o IP deste servidor dentro dela (interface wt0).
vpn_cidr: "100.96.0.0/16"
vpn_ip: "100.96.113.83"

# Sites servidos pelo Caddy deste servidor (caminhos relativos a configuration/apps).
caddy_sites:
  - netbird/config/netbird.caddy        # netbird.<domain>   público
  - portainer/config/portainer.caddy    # container.<domain> só VPN
  - beszel/config/beszel.caddy          # monitor.<domain>   só VPN
  - cockpit/cockpit.caddy               # cockpit.<domain>   só VPN

# Hosts privados: com CLOUDFLARE_API_TOKEN, o registro A de cada um passa a
# apontar para `vpn_ip`, então só quem está na VPN consegue conectar.
caddy_private_hosts:
  - container
  - monitor
  - cockpit

# Hosts públicos que rodam em outro peer: TLS termina aqui e segue pelo túnel.
caddy_tunnels:
  - domain: host.vinicius-gpl.com
    upstream: "100.96.62.172:80"        # Caddy local do PLUTO
    hosts:                              # usados quando não há wildcard (sem token)
      - sure
