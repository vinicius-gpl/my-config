# Desktop: roda na própria máquina. Os dotfiles vêm do repositório local, por
# symlink, então não faz sentido apontar para outro host — use este arquivo
# direto, sem copiar para hosts.ini (não há segredo nenhum aqui).
#
#   cd configuration/linux/arch/ansible
#   sudo -v && ansible-playbook -i inventory.ini setup_desktop.yml -K
#
# Pré-requisitos na máquina:
#   sudo pacman -S --needed ansible   (traz a community.general, de onde vem o
#                                      módulo pacman)
#
# Opções (todas com default; descomente só o que mudar):
#   system_upgrade=false     não roda pacman -Syu. O Arch não suporta upgrade
#                            parcial, então pular é a opção arriscada.
#   set_fish_as_shell=false  não troca o shell de login para fish.
#   pacman_nopasswd=true     grava uma regra NOPASSWD para o pacman no sudoers.
#                            Dispensa o "sudo -v" antes, mas quem está no wheel
#                            passa a instalar qualquer pacote sem senha.

[arch_desktops]
localhost ansible_connection=local
