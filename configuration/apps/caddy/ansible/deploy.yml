---
# =========================================================================
# === CADDY ===
# =========================================================================

- name: "[caddy] Criar diretórios de configuração"
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ caddy_path }}"
    - "{{ caddy_path }}/conf.d"
    - "{{ caddy_path }}/static"
  tags: [caddy]

- name: "[caddy] Implantar Caddyfile principal"
  copy:
    src: "{{ apps_dir }}/caddy/config/caddyfile.edge"
    dest: "{{ caddy_path }}/caddyfile"
    mode: '0644'
  tags: [caddy]

- name: "[caddy] Implantar configs de sites (*.caddy)"
  copy:
    src: "{{ apps_dir }}/{{ item }}"
    dest: "{{ caddy_path }}/conf.d/{{ item | basename }}"
    mode: '0644'
  loop: "{{ caddy_sites }}"
  tags: [caddy]

- name: "[caddy] Implantar hosts públicos encaminhados pelo túnel da VPN"
  template:
    src: "{{ apps_dir }}/caddy/config/tunnel.caddy.j2"
    dest: "{{ caddy_path }}/conf.d/tunnel.caddy"
    mode: '0644'
  when: caddy_tunnels | length > 0
  tags: [caddy]

# -------------------------------------------------------------------------
# Desafio DNS-01 (Cloudflare): só quando `cloudflare_api_token` é informado.
# A imagem é compilada na máquina que roda o Ansible (o servidor pode ter
# pouca RAM para compilar Go) e enviada pronta.
# -------------------------------------------------------------------------
- name: "[caddy] Compilar imagem com plugin Cloudflare (local)"
  shell: |
    set -e
    docker build -t {{ caddy_image }} {{ apps_dir }}/caddy
    docker save {{ caddy_image }} | gzip > /tmp/caddy-image.tar.gz
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  when: caddy_dns_challenge | bool
  tags: [caddy]

- name: "[caddy] Enviar imagem para o servidor"
  copy:
    src: /tmp/caddy-image.tar.gz
    dest: "{{ caddy_path }}/caddy-image.tar.gz"
    mode: '0600'
  when: caddy_dns_challenge | bool
  tags: [caddy]

- name: "[caddy] Carregar imagem no Docker do servidor"
  command: docker load -i {{ caddy_path }}/caddy-image.tar.gz
  when: caddy_dns_challenge | bool
  tags: [caddy]

- name: "[caddy] Apontar hosts privados para o IP da VPN na Cloudflare"
  community.general.cloudflare_dns:
    api_token: "{{ cloudflare_api_token }}"
    zone: "{{ cloudflare_zone | default(domain) }}"
    record: "{{ item }}"
    type: A
    value: "{{ vpn_ip }}"
    proxied: false
    solo: true
    state: present
  loop: "{{ caddy_private_hosts }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: (caddy_dns_challenge | bool) and vpn_ip is defined
  tags: [caddy]

- name: "[caddy] Copiar docker-compose do Caddy"
  copy:
    src: "{{ apps_dir }}/caddy/compose.yml"
    dest: "{{ caddy_path }}/docker-compose.yml"
    mode: '0644'
  tags: [caddy]

- name: "[caddy] Criar arquivo .env para o Caddy"
  copy:
    dest: "{{ caddy_path }}/.env"
    content: |
      EMAIL={{ email | default('admin@' + domain) }}
      DOMAIN={{ domain }}
      VPN_CIDR={{ vpn_cidr }}
      CADDY_IMAGE={{ caddy_image }}
      {% if caddy_dns_challenge %}
      CADDY_OPTS=acme_dns cloudflare {env.CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_API_TOKEN={{ cloudflare_api_token }}
      {% endif %}
    mode: '0600'
  no_log: true
  tags: [caddy]

- name: "[caddy] Validar configuração antes de subir"
  command: >
    docker run --rm --env-file {{ caddy_path }}/.env
    -v {{ caddy_path }}/caddyfile:/etc/caddy/Caddyfile:ro,z
    -v {{ caddy_path }}/conf.d:/etc/caddy/conf.d:ro,z
    {{ caddy_image }} caddy validate --config /etc/caddy/Caddyfile
  changed_when: false
  tags: [caddy]

- name: "[caddy] Subir container Caddy"
  command: docker compose up -d --force-recreate
  args:
    chdir: "{{ caddy_path }}"
  tags: [caddy]
