---
# =========================================================================
# === PORTAINER AGENT (PARA WORKERS / HETZNER) ===
# =========================================================================

- name: "[portainer-agent] Criar diretório de deploy do Portainer Agent"
  file:
    path: "{{ portainer_path }}"
    state: directory
    mode: '0755'
  tags: [portainer-agent, portainer_agent]

- name: "[portainer-agent] Validar se portainer_edge_id foi informado quando edge_key está ativa"
  fail:
    msg: "Você informou 'portainer_edge_key', mas 'portainer_edge_id' está faltando no inventário! Copie o EDGE_ID gerado no Portainer e adicione 'portainer_edge_id=\"SEU_EDGE_ID\"' no hosts.ini ou Secret."
  when:
    - portainer_edge_key is defined
    - portainer_edge_key | length > 0
    - portainer_edge_id is not defined or (portainer_edge_id | length == 0)
  tags: [portainer-agent, portainer_agent]

- name: "[portainer-agent] Gerar docker-compose do Portainer Agent"
  template:
    src: "{{ apps_dir }}/portainer/compose.agent.yml.j2"
    dest: "{{ portainer_path }}/docker-compose.yml"
    mode: '0644'
  tags: [portainer-agent, portainer_agent]

- name: "[portainer-agent] Limpar container de modo alternativo (e nome legado) para evitar conflito"
  command: docker rm -f {{ 'portainer-agent' if (portainer_edge_key is defined and portainer_edge_key | length > 0) else 'portainer-edge-agent' }} portainer_edge_agent
  failed_when: false
  tags: [portainer-agent, portainer_agent]

- name: "[portainer-agent] Abrir porta do Portainer Agent (9001) no firewall"
  firewalld:
    port: 9001/tcp
    permanent: yes
    state: enabled
    immediate: yes
  when: portainer_edge_key is not defined or (portainer_edge_key | length == 0)
  failed_when: false
  tags: [portainer-agent, portainer_agent]

- name: "[portainer-agent] Fechar porta do Portainer Agent (9001) no firewall em modo Edge"
  firewalld:
    port: 9001/tcp
    permanent: yes
    state: disabled
    immediate: yes
  when:
    - portainer_edge_key is defined
    - portainer_edge_key | length > 0
  failed_when: false
  tags: [portainer-agent, portainer_agent]

- name: "[portainer-agent] Subir container do Portainer Agent"
  command: docker compose up -d --force-recreate
  args:
    chdir: "{{ portainer_path }}"
  tags: [portainer-agent, portainer_agent]
