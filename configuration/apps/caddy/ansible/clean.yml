---
# =========================================================================
# === CADDY CLEAN / TEARDOWN ===
# =========================================================================

- name: "[caddy] Parar e remover container Caddy"
  command: docker rm -f caddy
  failed_when: false
  tags: [caddy]

- name: "[caddy] Remover diretório do Caddy (se solicitado)"
  file:
    path: "{{ caddy_path | default('/opt/caddy') }}"
    state: absent
  when: remove_volumes | default(false) | bool
  tags: [caddy]

- name: "[caddy] Parar e desabilitar o serviço do IP público no loopback"
  systemd:
    name: vpn-public-ip.service
    state: stopped
    enabled: no
  failed_when: false
  tags: [caddy]

- name: "[caddy] Remover o serviço do IP público no loopback"
  file:
    path: /etc/systemd/system/vpn-public-ip.service
    state: absent
  tags: [caddy]
