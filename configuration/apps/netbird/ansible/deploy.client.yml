---
# =========================================================================
# === NETBIRD CLIENT (PARA INGRESSAR NÓS NA VPN) ===
# =========================================================================

- name: "[netbird-client] Verificar se NetBird Client já está instalado"
  command: which netbird
  register: netbird_cli_check
  failed_when: false
  changed_when: false
  tags: [netbird-client, netbird_client]

- name: "[netbird-client] Instalar NetBird Client oficial (se não instalado)"
  shell: curl -fsSL https://pkgs.netbird.io/install.sh | env USE_BIN_INSTALL=true sh
  when: netbird_cli_check.rc != 0
  tags: [netbird-client, netbird_client]

- name: "[netbird-client] Restaurar contexto SELinux do binário do NetBird"
  command: restorecon -v /usr/bin/netbird
  failed_when: false
  tags: [netbird-client, netbird_client]

- name: "[netbird-client] Garantir resolução de loopback do NetBird no /etc/hosts (Hairpin NAT)"
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 netbird.{{ domain }}"
    state: present
  when: domain is defined and (domain | length > 0)
  failed_when: false
  tags: [netbird-client, netbird_client]

- name: "[netbird-client] Iniciar e habilitar serviço do NetBird"
  systemd:
    name: netbird
    state: started
    enabled: yes
  tags: [netbird-client, netbird_client]

- name: "[netbird-client] Conectar ao servidor NetBird com Setup Key"
  command: >
    netbird up
    --management-url "{{ netbird_mgmt_url | default('https://netbird.' + domain) }}"
    --setup-key "{{ netbird_setup_key }}"
  when: netbird_setup_key is defined and (netbird_setup_key | length > 0)
  register: netbird_connect_result
  changed_when: "'Connected' in netbird_connect_result.stdout or netbird_connect_result.rc == 0"
  failed_when: false
  tags: [netbird-client, netbird_client]
