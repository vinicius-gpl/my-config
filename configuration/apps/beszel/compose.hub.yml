networks:
  proxy:
    external: true

services:
  beszel:
    image: henrygd/beszel:0.21.0
    container_name: beszel
    hostname: beszel
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - beszel-data:/beszel_data
    networks:
      - proxy

volumes:
  beszel-data:
    name: beszel-data
