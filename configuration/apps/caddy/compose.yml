networks:
  proxy:
    external: true

services:
  caddy:
    image: caddy:2.9
    container_name: caddy
    restart: always
    environment:
      - EMAIL=${EMAIL}
      - DOMAIN=${DOMAIN}
      - CADDY_OPTS=${CADDY_OPTS:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CADDY_CONFIG_PATH:-/opt/caddy}/caddyfile:/etc/caddy/Caddyfile:z
      - ${CADDY_CONFIG_PATH:-/opt/caddy}/conf.d:/etc/caddy/conf.d:z
      - caddy-config:/config
      - caddy-data:/data
      - ${CADDY_CONFIG_PATH:-/opt/caddy}/static:/srv/static:ro,z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy

volumes:
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config
