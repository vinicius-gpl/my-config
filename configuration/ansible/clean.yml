---
- name: Clean / Teardown Server Services
  hosts: all
  become: yes
  vars:
    apps_dir: "{{ playbook_dir }}/../apps"
    caddy_path: "/opt/caddy"
    beszel_path: "/opt/beszel"
    beszel_hub_path: "/opt/beszel-hub"
    portainer_path: "/opt/portainer"
    wireguard_path: "/opt/wireguard"
    coolify_path: "/opt/coolify"
    supabase_path: "/opt/supabase"
    netbird_path: "/opt/netbird"
    netbird_proxy_path: "/opt/netbird-proxy"
    sure_path: "/opt/sure"
    element_call_path: "/opt/element-call"
    element_web_path: "/opt/element-web"
    monitoring_path: "/opt/monitoring"
    komodo_path: "/opt/komodo"
    komodo_periphery_path: "/opt/komodo-periphery"
    remove_volumes: "{{ remove_volumes | default(false) }}"

  tasks:
    # =========================================================================
    # === BESZEL HUB ===
    # =========================================================================
    - name: "[beszel-hub] Teardown Beszel Hub"
      include_tasks: "{{ apps_dir }}/beszel/ansible/clean.hub.yml"
      tags: [beszel-hub, beszel_hub, dashboards]

    # =========================================================================
    # === BESZEL AGENT ===
    # =========================================================================
    - name: "[beszel-agent] Teardown Beszel Agent"
      include_tasks: "{{ apps_dir }}/beszel/ansible/clean.agent.yml"
      tags: [beszel-agent, beszel_agent]

    # =========================================================================
    # === PORTAINER SERVER ===
    # =========================================================================
    - name: "[portainer] Teardown Portainer Server"
      include_tasks: "{{ apps_dir }}/portainer/ansible/clean.yml"
      tags: [portainer, dashboards]

    # =========================================================================
    # === PORTAINER AGENT ===
    # =========================================================================
    - name: "[portainer-agent] Teardown Portainer Agent"
      include_tasks: "{{ apps_dir }}/portainer/ansible/clean.agent.yml"
      tags: [portainer-agent, portainer_agent]

    # =========================================================================
    # === WIREGUARD ===
    # =========================================================================
    - name: "[wireguard] Teardown WireGuard"
      include_tasks: "{{ apps_dir }}/wireguard/ansible/clean.yml"
      tags: [wireguard]

    # =========================================================================
    # === NETBIRD SERVER ===
    # =========================================================================
    - name: "[netbird] Teardown NetBird Server"
      include_tasks: "{{ apps_dir }}/netbird/ansible/clean.server.yml"
      tags: [netbird]

    # =========================================================================
    # === NETBIRD CLIENT ===
    # =========================================================================
    - name: "[netbird-client] Teardown NetBird Client"
      include_tasks: "{{ apps_dir }}/netbird/ansible/clean.client.yml"
      tags: [netbird-client, netbird_client]

    # =========================================================================
    # === NETBIRD REVERSE PROXY ===
    # =========================================================================
    - name: "[netbird-proxy] Teardown NetBird Reverse Proxy"
      include_tasks: "{{ apps_dir }}/netbird/ansible/clean.proxy.yml"
      tags: [netbird-proxy, netbird_proxy]

    # =========================================================================
    # === COOLIFY ===
    # =========================================================================
    - name: "[coolify] Teardown Coolify PaaS"
      include_tasks: "{{ apps_dir }}/coolify/ansible/clean.yml"
      tags: [coolify]

    # =========================================================================
    # === SUPABASE ===
    # =========================================================================
    - name: "[supabase] Teardown Supabase Backend"
      include_tasks: "{{ apps_dir }}/supabase/ansible/clean.yml"
      tags: [supabase]

    # =========================================================================
    # === CADDY ===
    # =========================================================================
    - name: "[caddy] Teardown Caddy"
      include_tasks: "{{ apps_dir }}/caddy/ansible/clean.yml"
      tags: [caddy]

    # =========================================================================
    # === COCKPIT ===
    # =========================================================================
    - name: "[cockpit] Teardown Cockpit"
      include_tasks: "{{ apps_dir }}/cockpit/ansible/clean.yml"
      tags: [cockpit]

    # =========================================================================
    # === SURE ===
    # =========================================================================
    - name: "[sure] Teardown Sure"
      include_tasks: "{{ apps_dir }}/sure/ansible/clean.yml"
      tags: [sure]

    # =========================================================================
    # === ELEMENT CALL ===
    # =========================================================================
    - name: "[element-call] Teardown Element Call"
      include_tasks: "{{ apps_dir }}/element-call/ansible/clean.yml"
      tags: [element-call, element_call]

    # =========================================================================
    # === ELEMENT WEB ===
    # =========================================================================
    - name: "[element-web] Teardown Element Web"
      include_tasks: "{{ apps_dir }}/element-web/ansible/clean.yml"
      tags: [element-web, element_web]

    # =========================================================================
    # === MONITORING (PROMETHEUS + GRAFANA) ===
    # =========================================================================
    - name: "[monitoring] Teardown Monitoring"
      include_tasks: "{{ apps_dir }}/monitoring/ansible/clean.yml"
      tags: [monitoring, grafana, prometheus]

    # =========================================================================
    # === KOMODO CORE ===
    # =========================================================================
    - name: "[komodo] Teardown Komodo Core"
      include_tasks: "{{ apps_dir }}/komodo/ansible/clean.core.yml"
      tags: [komodo]

    # =========================================================================
    # === KOMODO PERIPHERY ===
    # =========================================================================
    - name: "[komodo-periphery] Teardown Komodo Periphery"
      include_tasks: "{{ apps_dir }}/komodo/ansible/clean.periphery.yml"
      tags: [komodo-periphery, komodo_periphery]

    # =========================================================================
    # === RECARREGAR CADDY (SE CADDY ESTIVER ATIVO) ===
    # =========================================================================
    - name: "[caddy] Recarregar Caddy após remoção de serviços"
      command: docker exec caddy caddy reload --config /etc/caddy/Caddyfile
      failed_when: false
      tags: [beszel-hub, beszel_hub, portainer, wireguard, netbird, cockpit, element-call, element_call, element-web, element_web, monitoring, grafana, komodo, dashboards]

    # =========================================================================
    # === DOCKER PRUNE (LIMPEZA DE IMAGENS ÓRFÃS / SISTEMA) ===
    # =========================================================================
    - name: "[prune] Limpeza de imagens e volumes"
      include_tasks: "tasks/prune.yml"
      tags: [prune, docker-prune]
