---
- name: Deploy Server Infrastructure
  hosts: all
  become: yes
  vars:
    apps_dir: "{{ playbook_dir }}/../apps"
    caddy_path: "/opt/caddy"
    beszel_path: "/opt/beszel"
    portainer_path: "/opt/portainer"
    wireguard_path: "/opt/wireguard"
    coolify_path: "/opt/coolify"
    coolify_data_path: "/data/coolify"
    supabase_path: "/opt/supabase"
    beszel_hub_path: "/opt/beszel-hub"

  tasks:
    # =========================================================================
    # === BASE: SISTEMA, FIREWALL E DOCKER (MULTI-DISTRO) ===
    # =========================================================================

    - name: "[base] Instalar dependências (Família RedHat: Fedora/Rocky/CentOS)"
      dnf:
        name:
          - dnf-plugins-core
          - firewalld
          - curl
        state: present
      when: ansible_os_family == 'RedHat'
      tags: [base]

    - name: "[base] Adicionar repositório do Docker (RedHat)"
      command: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo
      when: ansible_os_family == 'RedHat'
      tags: [base]

    - name: "[base] Instalar Docker (RedHat)"
      dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: ansible_os_family == 'RedHat'
      tags: [base]

    - name: "[base] Iniciar e habilitar Docker e Firewalld (RedHat)"
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - docker
        - firewalld
      when: ansible_os_family == 'RedHat'
      tags: [base]

    - name: "[base] Instalar dependências e Docker (Família Debian: Ubuntu/Debian)"
      block:
        - name: "[base] Atualizar cache do apt"
          apt:
            update_cache: yes
            cache_valid_time: 3600

        - name: "[base] Instalar pacotes base Debian"
          apt:
            name:
              - ca-certificates
              - curl
              - gnupg
              - lsb-release
            state: present

        - name: "[base] Criar diretório para keyrings do apt"
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: "[base] Baixar chave GPG oficial do Docker"
          get_url:
            url: https://download.docker.com/linux/debian/gpg
            dest: /etc/apt/keyrings/docker.gpg
            mode: '0644'

        - name: "[base] Adicionar repositório Docker no apt"
          apt_repository:
            repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
            state: present

        - name: "[base] Instalar pacotes Docker"
          apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: yes

        - name: "[base] Iniciar e habilitar Docker (Debian)"
          systemd:
            name: docker
            state: started
            enabled: yes
      when: ansible_os_family == 'Debian'
      tags: [base]

    - name: "[base] Abrir portas padrão no Firewalld (se ativo)"
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 80/tcp
        - 443/tcp
        - 443/udp
        - 7824/udp
        - 45876/tcp
      failed_when: false
      tags: [base]

    - name: "[base] Criar rede Docker compartilhada (proxy)"
      command: docker network create proxy
      register: proxy_net
      failed_when:
        - proxy_net.rc != 0
        - '"already exists" not in proxy_net.stderr'
      changed_when: proxy_net.rc == 0
      tags: [base, proxy]

    # =========================================================================
    # === WIREGUARD (wg-easy) ===
    # =========================================================================

    - name: "[wireguard] Desativar serviço bare-metal antigo wg-quick@wg0 (se existir)"
      systemd:
        name: wg-quick@wg0
        state: stopped
        enabled: no
      failed_when: false
      tags: [wireguard]

    - name: "[wireguard] Remover interface wg0 residual do kernel (se existir)"
      command: ip link delete dev wg0
      failed_when: false
      changed_when: false
      tags: [wireguard]

    - name: "[wireguard] Habilitar IP forwarding no host"
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: yes
        state: present
        reload: yes
      tags: [wireguard]

    - name: "[wireguard] Carregar módulos do kernel para iptables nat (exigidos pelo wg-quick)"
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - ip_tables
        - iptable_nat
      failed_when: false
      tags: [wireguard]

    - name: "[wireguard] Persistir módulos do kernel em /etc/modules-load.d/wireguard.conf"
      copy:
        dest: /etc/modules-load.d/wireguard.conf
        content: |
          ip_tables
          iptable_nat
        mode: '0644'
      failed_when: false
      tags: [wireguard]

    - name: "[wireguard] Criar diretórios de deploy"
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ wireguard_path }}"
        - "{{ wireguard_path }}/data"
      tags: [wireguard]

    - name: "[wireguard] Copiar docker-compose do wg-easy"
      copy:
        src: "{{ apps_dir }}/wireguard/compose.yml"
        dest: "{{ wireguard_path }}/docker-compose.yml"
        mode: '0644'
      tags: [wireguard]

    - name: "[wireguard] Gerar PASSWORD_HASH a partir de wg_password (se necessário)"
      command: "docker run --rm ghcr.io/wg-easy/wg-easy:latest wgpw '{{ wg_password }}'"
      register: generated_wg_hash
      when:
        - wg_password is defined
        - wg_password | length > 0
        - wg_password_hash is not defined or wg_password_hash | length == 0
      changed_when: false
      tags: [wireguard]

    - name: "[wireguard] Definir variável de hash da senha"
      set_fact:
        final_wg_hash: >-
          {{
            (generated_wg_hash.stdout | regex_replace("^PASSWORD_HASH=['\"]?", "") | regex_replace("['\"]?$", "") | trim)
            if (generated_wg_hash is defined and generated_wg_hash.stdout is defined and generated_wg_hash.stdout | length > 0)
            else (wg_password_hash | default('') | regex_replace("^PASSWORD_HASH=['\"]?", "") | regex_replace("['\"]?$", "") | trim)
          }}
      tags: [wireguard]

    - name: "[wireguard] Descobrir IP público do host"
      command: curl -s4 https://api.ipify.org
      register: host_public_ip
      changed_when: false
      failed_when: false
      tags: [wireguard]

    - name: "[wireguard] Definir IP público detectado"
      set_fact:
        detected_public_ip: "{{ host_public_ip.stdout | trim if (host_public_ip is defined and host_public_ip.stdout is defined and host_public_ip.stdout | length > 0) else '' }}"
      tags: [wireguard]

    - name: "[wireguard] Definir lista de AllowedIPs (Split Tunnel com IP público e rede local)"
      set_fact:
        final_allowed_ips: >-
          {{
            wg_allowed_ips
            if (wg_allowed_ips is defined and wg_allowed_ips | length > 0)
            else (
              '10.0.0.0/24'
              ~ (', ' ~ ansible_host ~ '/32' if (ansible_host is defined and ansible_host != 'localhost' and ansible_host != '127.0.0.1') else '')
              ~ (', ' ~ detected_public_ip ~ '/32' if (detected_public_ip | length > 0 and detected_public_ip != ansible_host) else '')
            )
          }}
      tags: [wireguard]

    - name: "[wireguard] Criar arquivo .env para o wg-easy"
      copy:
        dest: "{{ wireguard_path }}/.env"
        content: |
          WG_HOST={{ wg_host | default(domain) | default(detected_public_ip) | default(ansible_host) }}
          WG_DEVICE={{ ansible_default_ipv4.interface | default('eth0') }}
          WG_ALLOWED_IPS={{ final_allowed_ips }}
          PASSWORD_HASH={{ final_wg_hash }}
        mode: '0600'
      tags: [wireguard]

    - name: "[wireguard] Abrir porta UDP do WireGuard no firewall"
      firewalld:
        port: 51820/udp
        permanent: yes
        state: enabled
        immediate: yes
      failed_when: false
      tags: [wireguard]

    - name: "[wireguard] Habilitar masquerade no firewalld"
      firewalld:
        masquerade: yes
        permanent: yes
        state: enabled
        immediate: yes
      failed_when: false
      tags: [wireguard]

    - name: "[wireguard] Adicionar rede VPN (10.0.0.0/24) e interface wg0 na zona trusted do firewalld"
      firewalld:
        zone: trusted
        source: 10.0.0.0/24
        permanent: yes
        state: enabled
        immediate: yes
      failed_when: false
      tags: [wireguard]

    - name: "[wireguard] Adicionar interface wg0 na zona trusted do firewalld"
      firewalld:
        zone: trusted
        interface: wg0
        permanent: yes
        state: enabled
        immediate: yes
      failed_when: false
      tags: [wireguard]

    - name: "[wireguard] Subir container wg-easy"
      command: docker compose up -d --force-recreate
      args:
        chdir: "{{ wireguard_path }}"
      tags: [wireguard]

    - name: "[wireguard] Implantar configuração wireguard.caddy (se caddy existir)"
      copy:
        src: "{{ apps_dir }}/wireguard/config/wireguard.caddy"
        dest: "{{ caddy_path }}/conf.d/wireguard.caddy"
        mode: '0644'
      failed_when: false
      tags: [wireguard]

    - name: "[wireguard] Recarregar Caddy para aplicar vpn.{{ domain | default('') }}"
      command: docker exec caddy caddy reload --config /etc/caddy/Caddyfile
      failed_when: false
      tags: [wireguard]

    # =========================================================================
    # === CADDY ===
    # =========================================================================

    - name: "[caddy] Criar diretórios de configuração"
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ caddy_path }}"
        - "{{ caddy_path }}/conf.d"
        - "{{ caddy_path }}/static"
      tags: [caddy]

    - name: "[caddy] Implantar Caddyfile principal"
      copy:
        src: "{{ apps_dir }}/caddy/config/caddyfile"
        dest: "{{ caddy_path }}/caddyfile"
        mode: '0644'
      tags: [caddy]

    - name: "[caddy] Implantar configs de sites (*.caddy)"
      copy:
        src: "{{ item }}"
        dest: "{{ caddy_path }}/conf.d/{{ item | basename }}"
        mode: '0644'
      loop:
        - "{{ apps_dir }}/portainer/config/portainer.caddy"
        - "{{ apps_dir }}/wireguard/config/wireguard.caddy"
        - "{{ apps_dir }}/cockpit/cockpit.caddy"
      failed_when: false
      tags: [caddy]

    - name: "[caddy] Copiar docker-compose do Caddy"
      copy:
        src: "{{ apps_dir }}/caddy/compose.yml"
        dest: "{{ caddy_path }}/docker-compose.yml"
        mode: '0644'
      tags: [caddy]

    - name: "[caddy] Criar arquivo .env para o Caddy"
      copy:
        dest: "{{ caddy_path }}/.env"
        content: |
          EMAIL={{ email | default('admin@' + domain) }}
          DOMAIN={{ domain }}
        mode: '0600'
      tags: [caddy]

    - name: "[caddy] Subir container Caddy"
      command: docker compose up -d --force-recreate
      args:
        chdir: "{{ caddy_path }}"
      tags: [caddy]

    # =========================================================================
    # === PORTAINER ===
    # =========================================================================

    - name: "[portainer] Criar diretório de deploy"
      file:
        path: "{{ portainer_path }}"
        state: directory
        mode: '0755'
      tags: [portainer]

    - name: "[portainer] Copiar docker-compose do Portainer"
      copy:
        src: "{{ apps_dir }}/portainer/compose.yml"
        dest: "{{ portainer_path }}/docker-compose.yml"
        mode: '0644'
      tags: [portainer]

    - name: "[portainer] Subir containers Portainer"
      command: docker compose up -d --force-recreate
      args:
        chdir: "{{ portainer_path }}"
      tags: [portainer]

    # =========================================================================
    # === COOLIFY ===
    # =========================================================================

    - name: "[coolify] Criar diretório de deploy"
      file:
        path: "{{ coolify_path }}"
        state: directory
        mode: '0755'
      tags: [coolify]

    - name: "[coolify] Criar árvore /data/coolify"
      file:
        path: "{{ coolify_data_path }}/{{ item.path }}"
        state: directory
        owner: '9999'
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "", mode: '0755' }
        - { path: "ssh", mode: '0700' }
        - { path: "ssh/keys", mode: '0700' }
        - { path: "ssh/mux", mode: '0700' }
        - { path: "applications", mode: '0755' }
        - { path: "databases", mode: '0755' }
        - { path: "services", mode: '0755' }
        - { path: "backups", mode: '0755' }
        - { path: "webhooks-during-maintenance", mode: '0755' }
        - { path: "logs", mode: '0755' }
        - { path: "proxy", mode: '0755' }
        - { path: "proxy/dynamic", mode: '0755' }
        - { path: "source", mode: '0755' }
      loop_control:
        label: "{{ coolify_data_path }}/{{ item.path }}"
      tags: [coolify]

    - name: "[coolify] Gerar chave SSH que o Coolify usa para administrar o host"
      command: ssh-keygen -t ed25519 -a 100 -f {{ coolify_data_path }}/ssh/keys/id.root@host.docker.internal -q -N '' -C coolify
      args:
        creates: "{{ coolify_data_path }}/ssh/keys/id.root@host.docker.internal"
      tags: [coolify]

    - name: "[coolify] Ajustar permissões da chave SSH do Coolify"
      file:
        path: "{{ coolify_data_path }}/ssh/keys/{{ item.name }}"
        owner: '9999'
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { name: "id.root@host.docker.internal", mode: '0600' }
        - { name: "id.root@host.docker.internal.pub", mode: '0644' }
      loop_control:
        label: "{{ item.name }}"
      tags: [coolify]

    - name: "[coolify] Ler chave pública gerada"
      slurp:
        src: "{{ coolify_data_path }}/ssh/keys/id.root@host.docker.internal.pub"
      register: coolify_hostkey_pub
      tags: [coolify]

    - name: "[coolify] Autorizar chave no root do host"
      authorized_key:
        user: root
        key: "{{ coolify_hostkey_pub.content | b64decode | trim }}"
        state: present
      tags: [coolify]

    - name: "[coolify] Copiar docker-compose do Coolify"
      copy:
        src: "{{ apps_dir }}/coolify/compose.yml"
        dest: "{{ coolify_path }}/docker-compose.yml"
        mode: '0644'
      tags: [coolify]

    - name: "[coolify] Criar arquivo .env com credenciais"
      template:
        src: "{{ apps_dir }}/coolify/coolify.env.j2"
        dest: "{{ coolify_path }}/.env"
        mode: '0600'
      tags: [coolify]

    - name: "[coolify] Abrir portas do Coolify no firewall"
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 8000/tcp
        - 6001/tcp
        - 6002/tcp
      failed_when: false
      tags: [coolify]

    - name: "[coolify] Subir containers do Coolify"
      command: docker compose up -d --force-recreate
      args:
        chdir: "{{ coolify_path }}"
      tags: [coolify]

    # =========================================================================
    # === SUPABASE ===
    # =========================================================================

    - name: "[supabase] Criar diretório de deploy"
      file:
        path: "{{ supabase_path }}"
        state: directory
        mode: '0755'
      tags: [supabase]

    - name: "[supabase] Implantar configs (kong, init do banco)"
      copy:
        src: "{{ apps_dir }}/supabase/config/"
        dest: "{{ supabase_path }}/config/"
        mode: '0644'
        directory_mode: '0755'
      tags: [supabase]

    - name: "[supabase] Copiar docker-compose do Supabase"
      copy:
        src: "{{ apps_dir }}/supabase/compose.yml"
        dest: "{{ supabase_path }}/docker-compose.yml"
        mode: '0644'
      tags: [supabase]

    - name: "[supabase] Criar arquivo .env do Supabase"
      template:
        src: "{{ apps_dir }}/supabase/supabase.env.j2"
        dest: "{{ supabase_path }}/.env"
        mode: '0600'
      tags: [supabase]

    - name: "[supabase] Abrir porta do Supabase no firewall (8001)"
      firewalld:
        port: 8001/tcp
        permanent: yes
        state: enabled
        immediate: yes
      failed_when: false
      tags: [supabase]

    - name: "[supabase] Subir containers do Supabase"
      command: docker compose up -d --force-recreate
      args:
        chdir: "{{ supabase_path }}"
      environment:
        COMPOSE_PROFILES: "{{ supabase_profiles | default('') }}"
      tags: [supabase]

    # =========================================================================
    # === BESZEL ===
    # =========================================================================

    - name: "[beszel] Criar diretório de deploy"
      file:
        path: "{{ beszel_path }}"
        state: directory
        mode: '0755'
      tags: [beszel]

    - name: "[beszel] Copiar docker-compose do Beszel Agent"
      copy:
        src: "{{ apps_dir }}/beszel/compose.agent.yml"
        dest: "{{ beszel_path }}/docker-compose.yml"
        mode: '0644'
      tags: [beszel]

    - name: "[beszel] Criar arquivo .env do Beszel"
      copy:
        dest: "{{ beszel_path }}/.env"
        content: |
          BESZEL_KEY={{ beszel_key }}
        mode: '0600'
      tags: [beszel]

    - name: "[beszel] Abrir porta do Beszel no firewall (45876)"
      firewalld:
        port: 45876/tcp
        permanent: yes
        state: enabled
        immediate: yes
      failed_when: false
      tags: [beszel]

    - name: "[beszel] Subir containers do Beszel Agent"
      command: docker compose up -d --force-recreate
      args:
        chdir: "{{ beszel_path }}"
      tags: [beszel]

    # =========================================================================
    # === BESZEL HUB ===
    # =========================================================================

    - name: "[beszel-hub] Criar diretório de deploy do Hub"
      file:
        path: "{{ beszel_hub_path }}"
        state: directory
        mode: '0755'
      tags: [beszel-hub, beszel_hub]

    - name: "[beszel-hub] Copiar docker-compose do Beszel Hub"
      copy:
        src: "{{ apps_dir }}/beszel/compose.hub.yml"
        dest: "{{ beszel_hub_path }}/docker-compose.yml"
        mode: '0644'
      tags: [beszel-hub, beszel_hub]

    - name: "[beszel-hub] Abrir porta do Beszel Hub no firewall (8090)"
      firewalld:
        port: 8090/tcp
        permanent: yes
        state: enabled
        immediate: yes
      failed_when: false
      tags: [beszel-hub, beszel_hub]

    - name: "[beszel-hub] Implantar configuração beszel.caddy (se caddy existir)"
      copy:
        src: "{{ apps_dir }}/beszel/config/beszel.caddy"
        dest: "{{ caddy_path }}/conf.d/beszel.caddy"
        mode: '0644'
      failed_when: false
      tags: [beszel-hub, beszel_hub]

    - name: "[beszel-hub] Recarregar Caddy para aplicar monitor.{{ domain | default('') }}"
      command: docker exec caddy caddy reload --config /etc/caddy/Caddyfile
      failed_when: false
      tags: [beszel-hub, beszel_hub]

    - name: "[beszel-hub] Subir container do Beszel Hub"
      command: docker compose up -d --force-recreate
      args:
        chdir: "{{ beszel_hub_path }}"
      tags: [beszel-hub, beszel_hub]

    # =========================================================================
    # === COCKPIT ===
    # =========================================================================

    - name: "[cockpit] Instalar Cockpit"
      package:
        name: cockpit
        state: present
      tags: [cockpit]

    - name: "[cockpit] Habilitar e iniciar cockpit.socket"
      systemd:
        name: cockpit.socket
        state: started
        enabled: yes
      tags: [cockpit]

    - name: "[cockpit] Configurar origins no cockpit.conf"
      template:
        src: "{{ apps_dir }}/cockpit/cockpit.conf.j2"
        dest: /etc/cockpit/cockpit.conf
        mode: '0644'
      notify: Restart cockpit
      tags: [cockpit]

    - name: "[cockpit] Abrir porta do Cockpit no firewall (9090)"
      firewalld:
        port: 9090/tcp
        permanent: yes
        state: enabled
        immediate: yes
      failed_when: false
      tags: [cockpit]

  handlers:
    - name: Restart cockpit
      systemd:
        name: cockpit
        state: restarted
