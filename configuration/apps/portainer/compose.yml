networks:
  proxy:
    external: true

services:
  portainer:
    container_name: portainer
    hostname: portainer
    image: portainer/portainer-ee:lts
    restart: always
    ports:
      - "8000:8000"
      - "9443:9443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "portainer-data:/data"
    networks:
      - proxy

volumes:
  portainer-data:
    name: portainer-data
