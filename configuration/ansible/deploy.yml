---
- name: Deploy Server Infrastructure
  hosts: all
  become: yes
  vars:
    apps_dir: "{{ playbook_dir }}/../apps"
    caddy_path: "/opt/caddy"
    beszel_path: "/opt/beszel"
    beszel_hub_path: "/opt/beszel-hub"
    portainer_path: "/opt/portainer"
    wireguard_path: "/opt/wireguard"
    coolify_path: "/opt/coolify"
    coolify_data_path: "/data/coolify"
    supabase_path: "/opt/supabase"
    netbird_path: "/opt/netbird"
    netbird_proxy_path: "/opt/netbird-proxy"
    sure_path: "/opt/sure"
    portainer_edge_id: ""
    portainer_edge_key: ""
    netbird_proxy_token: ""
    netbird_proxy_domain: ""
    netbird_proxy_address: ""

  tasks:
    # -------------------------------------------------------------------------
    # Base: Sistema, Swap, Docker e Rede Compartilhada (proxy)
    # -------------------------------------------------------------------------
    - name: "[base] Preparação do Sistema e Docker"
      include_tasks: "tasks/base.yml"
      tags: [base, proxy, always]

    # -------------------------------------------------------------------------
    # Apps e Serviços
    # -------------------------------------------------------------------------
    - name: "[wireguard] Deploy WireGuard (wg-easy)"
      include_tasks: "{{ apps_dir }}/wireguard/ansible/deploy.yml"
      tags: [wireguard]

    - name: "[caddy] Deploy Caddy Reverse Proxy"
      include_tasks: "{{ apps_dir }}/caddy/ansible/deploy.yml"
      tags: [caddy]

    - name: "[portainer] Deploy Portainer Server"
      include_tasks: "{{ apps_dir }}/portainer/ansible/deploy.yml"
      tags: [portainer]

    - name: "[portainer-agent] Deploy Portainer Agent / Edge"
      include_tasks: "{{ apps_dir }}/portainer/ansible/deploy.agent.yml"
      tags: [portainer-agent, portainer_agent]

    - name: "[coolify] Deploy Coolify PaaS"
      include_tasks: "{{ apps_dir }}/coolify/ansible/deploy.yml"
      tags: [coolify]

    - name: "[supabase] Deploy Supabase Backend"
      include_tasks: "{{ apps_dir }}/supabase/ansible/deploy.yml"
      tags: [supabase]

    - name: "[beszel] Deploy Beszel Agent"
      include_tasks: "{{ apps_dir }}/beszel/ansible/deploy.agent.yml"
      tags: [beszel, beszel-agent, beszel_agent]

    - name: "[beszel-hub] Deploy Beszel Hub"
      include_tasks: "{{ apps_dir }}/beszel/ansible/deploy.hub.yml"
      tags: [beszel-hub, beszel_hub]

    - name: "[netbird] Deploy NetBird Server"
      include_tasks: "{{ apps_dir }}/netbird/ansible/deploy.server.yml"
      tags: [netbird]

    - name: "[netbird-client] Conectar NetBird Client"
      include_tasks: "{{ apps_dir }}/netbird/ansible/deploy.client.yml"
      tags: [netbird-client, netbird_client]

    - name: "[netbird-proxy] Deploy NetBird Reverse Proxy"
      include_tasks: "{{ apps_dir }}/netbird/ansible/deploy.proxy.yml"
      tags: [netbird-proxy, netbird_proxy]

    - name: "[cockpit] Instalar e Configurar Cockpit"
      include_tasks: "{{ apps_dir }}/cockpit/ansible/deploy.yml"
      tags: [cockpit]

    - name: "[sure] Deploy Sure (Maybe Finance)"
      include_tasks: "{{ apps_dir }}/sure/ansible/deploy.yml"
      when: (sure_enabled is defined and sure_enabled | bool) or ('sure' in ansible_run_tags)
      tags: [sure]

  handlers:
    - name: Restart cockpit
      systemd:
        name: cockpit
        state: restarted
