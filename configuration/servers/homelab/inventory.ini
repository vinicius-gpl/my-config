# Modelo. Copie para hosts.ini (ignorado pelo git) ou guarde o conteúdo real no
# secret ANSIBLE_ROCKY_HOSTS_INI, que é o que o workflow rocky-ansible.yml usa.
#
# ORDEM DE USO
# ------------
#   1. host_init.yml    primeiro acesso, entra por senha e instala sua chave.
#                       Pergunta a senha do root ao subir. Precisa de sshpass.
#   2. setup_server.yml o provisionamento, já por chave.
#
# Opções do host_init (todas com default; descomente só o que mudar):
#   admin_ssh_key_file    chave pública a instalar (default ~/.ssh/id_ed25519.pub)
#   server_hostname       define o hostname da máquina
#   server_timezone       default America/Sao_Paulo
#   update_system=true    roda dnf update completo (default: não)
#   disable_password_auth=true
#                         desliga senha no sshd. SÓ depois de confirmar que
#                         "ssh root@IP" entra sem pedir senha, senão você se
#                         tranca fora da máquina.
#
# COMO GERAR OS SEGREDOS
# ----------------------
#   openssl rand -hex 16          -> coolify_app_id, coolify_pusher_app_id
#   openssl rand -hex 24          -> coolify_db_password, coolify_redis_password
#   openssl rand -hex 32          -> coolify_pusher_app_key/secret,
#                                    supabase_jwt_secret, supabase_secret_key_base
#   openssl rand -base64 32       -> coolify_app_key (prefixe com "base64:")
#   openssl rand -hex 8           -> supabase_realtime_enc_key (16 caracteres)
#   openssl rand -base64 18       -> supabase_postgres_password,
#                                    supabase_dashboard_password
#
# supabase_anon_key e supabase_service_role_key são JWTs HS256 assinados com o
# supabase_jwt_secret. Gere os dois com o mesmo secret:
#
#   SECRET='<supabase_jwt_secret>'
#   b64url(){ openssl base64 -A | tr '+/' '-_' | tr -d '='; }
#   mk(){ h=$(printf '%s' '{"alg":"HS256","typ":"JWT"}'|b64url); p=$(printf '%s' "$1"|b64url);
#         printf '%s.%s.%s' "$h" "$p" "$(printf '%s.%s' "$h" "$p"|openssl dgst -sha256 -hmac "$SECRET" -binary|b64url)"; }
#   mk '{"role":"anon","iss":"supabase","iat":1700000000,"exp":2200000000}'
#   mk '{"role":"service_role","iss":"supabase","iat":1700000000,"exp":2200000000}'
#
# ATENÇÃO
#   coolify_app_key não pode mudar depois do primeiro boot — é a chave que cifra
#   o banco do Coolify, chaves SSH dos servidores inclusive. Guarde.
#   coolify_root_password passa pela validação do Coolify: maiúscula, minúscula,
#   número, símbolo e fora de vazamentos conhecidos. E o domínio de
#   coolify_root_email precisa resolver em DNS — nada de .local.
#   supabase_postgres_password é gravada nas roles no primeiro boot do banco:
#   trocar depois exige down -v (perde os dados).
#
# supabase_profiles=extras liga realtime, imgproxy e edge functions (10
# containers em vez de 7). Omita para subir só o essencial.

[rocky_servers]
192.168.10.60 ansible_user=root ansible_ssh_forward_agent=true domain=acerola.app beszel_key=CHAVE_PUBLICA_GERADA_PELO_HUB coolify_root_email=admin@acerola.app coolify_root_password=TROQUE_Aa1! coolify_app_id=TROQUE coolify_app_key=base64:TROQUE coolify_db_password=TROQUE coolify_redis_password=TROQUE coolify_pusher_app_id=TROQUE coolify_pusher_app_key=TROQUE coolify_pusher_app_secret=TROQUE supabase_postgres_password=TROQUE supabase_jwt_secret=TROQUE_32_CARACTERES_OU_MAIS supabase_anon_key=TROQUE supabase_service_role_key=TROQUE supabase_dashboard_password=TROQUE supabase_secret_key_base=TROQUE_64_CARACTERES supabase_realtime_enc_key=TROQUE_16_CARAC supabase_profiles=
